<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMB2 Runz</title>

<style>

body{
    background:#c0c0c0;
    font-family:Tahoma, Arial, sans-serif;
    margin:20px;
    color:black;
}

.wrapper{
    max-width:1100px;
    margin:auto;
}

.header{
    background:white;
    border:2px solid black;
    padding:20px;
    margin-bottom:20px;
}

h1{
    margin:0;
    font-size:42px;
}

.subtitle{
    margin-top:5px;
    color:#333;
    font-size:15px;
}

.topButtons{
    margin-top:15px;
}

.infoButton{
    background:#dcdcdc;
    border:2px outset white;
    padding:6px 14px;
    cursor:pointer;
    font-weight:bold;
}

.infoButton:active{
    border:2px inset white;
}

.controls{
    background:white;
    border:2px solid black;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

select,
input{
    padding:8px;
    font-size:14px;
    border:1px solid black;
}

input{
    flex:1;
    min-width:250px;
}

.board{
    background:white;
    border:2px solid black;
    margin-bottom:25px;
    overflow-x:auto;
}

.boardTitle{
    background:navy;
    color:white;
    padding:10px;
    font-size:20px;
    font-weight:bold;
    text-transform:capitalize;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#e6e6e6;
    padding:10px;
    border:1px solid black;
    text-align:left;
}

td{
    padding:10px;
    border:1px solid black;
}

.watchButton{
    background:#dcdcdc;
    border:2px outset white;
    padding:6px 14px;
    cursor:pointer;
    font-weight:bold;
}

.watchButton:active{
    border:2px inset white;
}

.noRuns{
    padding:15px;
    font-style:italic;
}

.footer{
    margin-top:25px;
    text-align:center;
    font-size:12px;
    color:#333;
}

@media (max-width:700px){

    h1{
        font-size:32px;
    }

    th,
    td{
        font-size:13px;
    }

}

</style>

</head>

<body>

<div class="wrapper">

    <div class="header">

        <h1>SMB2 Runz</h1>

        <div class="subtitle">
            Super Monkey Ball 2 Speedrun Leaderboards
        </div>

        <div class="topButtons">

            <button
            onclick="window.location.href='https://smb2.bot.nu/info.html'">
            INFO
            </button>

        </div>

    </div>

    <div class="controls">

        <select id="categorySelect">

            <option value="All">
                All Categories
            </option>

        </select>

        <input
        type="text"
        id="searchBox"
        placeholder="Search players or levels">

    </div>

    <div id="leaderboardArea"></div>

    <div class="footer">
        SMB2 RUNZ
    </div>

</div>

<script>

var leaderboardData = [

{
    category:"expert",

    runs:[

        {
            player:"Epick",
            level:"1-8 Sliders",
            time:"51:10",
            video:"https://youtu.be/dNOhjibRY8w"
        },

        {
            player:"PIN",
            level:"4-3 Beehive",
            time:"52:40",
            video:"https://youtu.be/EcwDBDsHlpI?si=_f_Rp_k8P22R9VGw"
        }

    ]
}

];

/*
========================
LOAD CATEGORY DROPDOWN
========================
*/

var categorySelect =
document.getElementById("categorySelect");

for(var i = 0; i < leaderboardData.length; i++){

    var option =
    document.createElement("option");

    option.value =
    leaderboardData[i].category;

    option.textContent =
    leaderboardData[i].category;

    categorySelect.appendChild(option);

}

/*
========================
RENDER LEADERBOARDS
========================
*/

function renderBoards(){

    var container =
    document.getElementById("leaderboardArea");

    container.innerHTML = "";

    var selectedCategory =
    categorySelect.value;

    var searchText =
    document
    .getElementById("searchBox")
    .value
    .toLowerCase();

    var anythingVisible = false;

    for(var i = 0; i < leaderboardData.length; i++){

        var board = leaderboardData[i];

        if(
            selectedCategory != "All"
            &&
            board.category != selectedCategory
        ){
            continue;
        }

        var html = "";

        html += `
        <div class="board">

            <div class="boardTitle">
                ${board.category}
            </div>

            <table>

                <tr>
                    <th>Player</th>
                    <th>Level</th>
                    <th width="140">Time</th>
                    <th width="180">Video</th>
                </tr>
        `;

        var visibleRuns = 0;

        for(var j = 0; j < board.runs.length; j++){

            var run = board.runs[j];

            var combinedText =
            (
                run.player + " " + run.level
            ).toLowerCase();

            if(
                combinedText.indexOf(searchText)
                == -1
            ){
                continue;
            }

            visibleRuns++;
            anythingVisible = true;

            html += `
            <tr>

                <td>${run.player}</td>

                <td>${run.level}</td>

                <td>${run.time}</td>

                <td>

                    <button
                    class="watchButton"
                    onclick="window.open('${run.video}')">

                    WATCH

                    </button>

                </td>

            </tr>
            `;
        }

        if(visibleRuns == 0){

            html += `
            <tr>

                <td
                colspan="4"
                class="noRuns">

                No runs found.

                </td>

            </tr>
            `;
        }

        html += `
            </table>
        </div>
        `;

        container.innerHTML += html;

    }

    if(!anythingVisible){

        container.innerHTML = `
        <div class="board">

            <div class="noRuns">
                No matching runs found.
            </div>

        </div>
        `;
    }

}

/*
========================
EVENTS
========================
*/

categorySelect.onchange =
renderBoards;

document
.getElementById("searchBox")
.onkeyup =
renderBoards;

/*
========================
START WEBSITE
========================
*/

renderBoards();

</script>

</body>

</html>
